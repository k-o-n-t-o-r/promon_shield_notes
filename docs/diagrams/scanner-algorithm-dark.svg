<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 880 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="scanner-algorithm-dark-title scanner-algorithm-dark-desc" id="scanner-algorithm-dark-root">
        <title id="scanner-algorithm-dark-title">SHIELD live-vs-file scanner decision flow</title>
        <desc id="scanner-algorithm-dark-desc">Flowchart showing argument validation, exact seek and read, optional page-span protection, byte comparison, tagged mismatch output, and the shared fail-closed error result.</desc>
        <defs>
      <style>#scanner-algorithm-dark-root { --paper:#1d2021;--paper-2:#282828;--ink:#ebdbb2;--muted:#bdae93;--soft:#a89984;--accent:#b8bb26;--sans:'Geist',system-ui,sans-serif;--serif:'Instrument Serif',serif;--mono:'Geist Mono',ui-monospace,monospace }
      #scanner-algorithm-dark-root { color: var(--ink); font-family: var(--sans); }
      #scanner-algorithm-dark-root .diagram-container { width:100%;overflow-x:auto }
      #scanner-algorithm-dark-root .name { fill:var(--ink);font:600 12px var(--sans);text-anchor:middle }
      #scanner-algorithm-dark-root .sub { fill:var(--muted);font:400 9px var(--mono);text-anchor:middle }
      #scanner-algorithm-dark-root .branch { fill:var(--soft);font:500 8px var(--mono);letter-spacing:.1em;text-anchor:middle }
      #scanner-algorithm-dark-root .legend-label { fill:var(--muted);font:500 8px var(--mono);letter-spacing:.16em }
      #scanner-algorithm-dark-root .legend-text { fill:var(--muted);font:400 9px var(--sans) }
      #scanner-algorithm-dark-root .diagram-container { overflow-x:visible }</style>
          <marker id="scanner-algorithm-dark-scanner-algorithm-dark-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#bdae93"/></marker>
          <marker id="scanner-algorithm-dark-scanner-algorithm-dark-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#b8bb26"/></marker>
        </defs>
        <rect width="880" height="700" fill="#1d2021"/>

        <!-- Connectors first -->
        <line x1="520" y1="80" x2="520" y2="96" stroke="#bdae93" marker-end="url(#scanner-algorithm-dark-scanner-algorithm-dark-arrow)"/>
        <line x1="520" y1="176" x2="520" y2="212" stroke="#bdae93" marker-end="url(#scanner-algorithm-dark-scanner-algorithm-dark-arrow)"/>
        <line x1="520" y1="292" x2="520" y2="328" stroke="#bdae93" marker-end="url(#scanner-algorithm-dark-scanner-algorithm-dark-arrow)"/>

        <path d="M400 136 H128 Q120 136 120 144 V456" fill="none" stroke="#fb4934" stroke-width="1.1" marker-end="url(#scanner-algorithm-dark-scanner-algorithm-dark-arrow)"/>
        <path d="M400 252 H188 Q180 252 180 260 V456" fill="none" stroke="#fb4934" stroke-width="1.1" marker-end="url(#scanner-algorithm-dark-scanner-algorithm-dark-arrow)"/>

        <path d="M400 368 H412 Q420 368 420 376 V456" fill="none" stroke="#bdae93" marker-end="url(#scanner-algorithm-dark-scanner-algorithm-dark-arrow)"/>
        <path d="M640 368 H692 Q700 368 700 376 V456" fill="none" stroke="#b8bb26" stroke-width="1.3" marker-end="url(#scanner-algorithm-dark-scanner-algorithm-dark-arrow-accent)"/>
        <line x1="520" y1="488" x2="600" y2="488" stroke="#b8bb26" stroke-width="1.3" marker-end="url(#scanner-algorithm-dark-scanner-algorithm-dark-arrow-accent)"/>
        <path d="M380 520 V544 Q380 552 372 552 H164 Q156 552 156 544 V520" fill="none" stroke="#fb4934" stroke-width="1.1" marker-end="url(#scanner-algorithm-dark-scanner-algorithm-dark-arrow)"/>
        <line x1="700" y1="520" x2="700" y2="568" stroke="#b8bb26" stroke-width="1.3" marker-end="url(#scanner-algorithm-dark-scanner-algorithm-dark-arrow-accent)"/>

        <!-- Branch labels -->
        <rect x="536" y="184" width="32" height="12" rx="2" fill="#1d2021"/><text x="552" y="193" class="branch">VALID</text>
        <rect x="536" y="300" width="32" height="12" rx="2" fill="#1d2021"/><text x="552" y="309" class="branch">EXACT</text>
        <rect x="240" y="116" width="48" height="12" rx="2" fill="#1d2021"/><text x="264" y="125" class="branch" fill="#fb4934">INVALID</text>
        <rect x="260" y="232" width="40" height="12" rx="2" fill="#1d2021"/><text x="280" y="241" class="branch" fill="#fb4934">SHORT</text>
        <rect x="380" y="388" width="32" height="12" rx="2" fill="#1d2021"/><text x="396" y="397" class="branch">YES</text>
        <rect x="708" y="388" width="32" height="12" rx="2" fill="#1d2021"/><text x="724" y="397" class="branch" fill="#b8bb26">NO</text>
        <rect x="548" y="468" width="40" height="12" rx="2" fill="#1d2021"/><text x="568" y="477" class="branch" fill="#b8bb26">RX OK</text>
        <rect x="708" y="536" width="64" height="12" rx="2" fill="#1d2021"/><text x="740" y="545" class="branch" fill="#b8bb26">MISMATCH BIT</text>
        <rect x="240" y="532" width="48" height="12" rx="2" fill="#1d2021"/><text x="264" y="541" class="branch" fill="#fb4934">RX FAIL</text>

        <!-- Nodes -->
        <rect x="440" y="32" width="160" height="48" rx="20" fill="#ebdbb2" fill-opacity=".035" stroke="#ebdbb2" stroke-opacity=".30"/>
        <text x="520" y="60" class="name">Scan request</text>

        <polygon points="520,96 640,136 520,176 400,136" fill="#282828" stroke="#ebdbb2" stroke-opacity=".40"/>
        <text x="520" y="132" class="name">Arguments valid?</text><text x="520" y="150" class="sub">fd · offset · length ≤ page</text>

        <polygon points="520,212 640,252 520,292 400,252" fill="#282828" stroke="#ebdbb2" stroke-opacity=".40"/>
        <text x="520" y="248" class="name">Exact seek + read?</text><text x="520" y="266" class="sub">requested bytes returned</text>

        <polygon points="520,328 640,368 520,408 400,368" fill="#282828" stroke="#ebdbb2" stroke-opacity=".40"/>
        <text x="520" y="358" class="name">force_rx set?</text><text x="520" y="378" class="sub">normalize live page span</text>

        <rect x="320" y="456" width="200" height="64" rx="6" fill="#282828" stroke="#ebdbb2" stroke-opacity=".34"/>
        <text x="420" y="484" class="name">Build page span</text><text x="420" y="504" class="sub">align · mprotect(PROT_RX)</text>

        <rect x="600" y="456" width="200" height="64" rx="6" fill="#b8bb26" fill-opacity=".10" stroke="#b8bb26"/>
        <text x="700" y="484" class="name">Compare live bytes</text><text x="700" y="504" class="sub">private qword/byte bcmp</text>

        <rect x="600" y="568" width="200" height="56" rx="20" fill="#b8bb26" fill-opacity=".10" stroke="#b8bb26"/>
        <text x="700" y="594" class="name">Tagged scan result</text><text x="700" y="612" class="sub">tag · mismatch · initialized</text>

        <rect x="80" y="456" width="152" height="64" rx="20" fill="#fb4934" fill-opacity=".07" stroke="#fb4934" stroke-opacity=".70"/>
        <text x="156" y="484" class="name">Error result</text><text x="156" y="504" class="sub">fail closed</text>

        <!-- Legend -->
        <line x1="40" y1="656" x2="840" y2="656" stroke="#ebdbb2" stroke-opacity=".14"/>
        <text x="40" y="680" class="legend-label">LEGEND</text>
        <polygon points="152,674 166,667 180,674 166,681" fill="#282828" stroke="#ebdbb2" stroke-opacity=".40"/><text x="192" y="678" class="legend-text">Decision</text>
        <rect x="300" y="667" width="28" height="14" rx="3" fill="#282828" stroke="#ebdbb2" stroke-opacity=".34"/><text x="340" y="678" class="legend-text">Action</text>
        <rect x="448" y="667" width="28" height="14" rx="7" fill="#b8bb26" fill-opacity=".10" stroke="#b8bb26"/><text x="488" y="678" class="legend-text">Tagged success</text>
        <rect x="624" y="667" width="28" height="14" rx="7" fill="#fb4934" fill-opacity=".07" stroke="#fb4934" stroke-opacity=".70"/><text x="664" y="678" class="legend-text">Shared error</text>
      </svg>
