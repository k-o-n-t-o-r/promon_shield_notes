<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="shield-startup-sequence-dark-title shield-startup-sequence-dark-desc" id="shield-startup-sequence-dark-root">
        <title id="shield-startup-sequence-dark-title">SHIELD startup and verdict sequence</title>
        <desc id="shield-startup-sequence-dark-desc">Sequence showing the Java wrapper loading SHIELD, the unpacker reconstructing protected code, the native core starting the self-tracer and detector workers, and clean or violation results releasing or poisoning application startup.</desc>
        <defs>
      <style>#shield-startup-sequence-dark-root { --paper:#1d2021;--paper-2:#282828;--ink:#ebdbb2;--muted:#bdae93;--soft:#a89984;--accent:#b8bb26;--link:#83a598;--sans:'Geist',system-ui,sans-serif;--serif:'Instrument Serif',serif;--mono:'Geist Mono',ui-monospace,monospace }
      #shield-startup-sequence-dark-root { color: var(--ink); font-family: var(--sans); }
      #shield-startup-sequence-dark-root .diagram-container { width:100%;overflow-x:auto }
      #shield-startup-sequence-dark-root .actor { fill:var(--ink);font:600 12px var(--sans);text-anchor:middle }
      #shield-startup-sequence-dark-root .actor-sub { fill:var(--muted);font:400 8px var(--mono);text-anchor:middle }
      #shield-startup-sequence-dark-root .message { fill:var(--soft);font:400 8px var(--mono);letter-spacing:.04em;text-anchor:middle }
      #shield-startup-sequence-dark-root .guard { fill:var(--muted);font:400 8px var(--mono);letter-spacing:.04em }
      #shield-startup-sequence-dark-root .fragment { fill:var(--muted);font:500 8px var(--mono);letter-spacing:.12em;text-anchor:middle }
      #shield-startup-sequence-dark-root .legend-label { fill:var(--muted);font:500 8px var(--mono);letter-spacing:.16em }
      #shield-startup-sequence-dark-root .legend-text { fill:var(--muted);font:400 9px var(--sans) }
      #shield-startup-sequence-dark-root .diagram-container { overflow-x:visible }</style>
          <marker id="shield-startup-sequence-dark-shield-startup-sequence-dark-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#bdae93"/></marker>
          <marker id="shield-startup-sequence-dark-shield-startup-sequence-dark-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#b8bb26"/></marker>
          <marker id="shield-startup-sequence-dark-shield-startup-sequence-dark-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#83a598"/></marker>
        </defs>
        <rect width="1280" height="720" fill="#1d2021"/>

        <!-- Lifelines -->
        <line x1="160" y1="96" x2="160" y2="628" stroke="#ebdbb2" stroke-opacity=".20" stroke-dasharray="3,3"/>
        <line x1="400" y1="96" x2="400" y2="628" stroke="#ebdbb2" stroke-opacity=".20" stroke-dasharray="3,3"/>
        <line x1="640" y1="96" x2="640" y2="628" stroke="#ebdbb2" stroke-opacity=".20" stroke-dasharray="3,3"/>
        <line x1="880" y1="96" x2="880" y2="628" stroke="#ebdbb2" stroke-opacity=".20" stroke-dasharray="3,3"/>
        <line x1="1120" y1="96" x2="1120" y2="628" stroke="#ebdbb2" stroke-opacity=".20" stroke-dasharray="3,3"/>

        <!-- Activation bars -->
        <rect x="156" y="120" width="8" height="496" fill="#ebdbb2" fill-opacity=".06" stroke="#bdae93" stroke-width=".8"/>
        <rect x="396" y="120" width="8" height="496" fill="#b8bb26" fill-opacity=".08" stroke="#b8bb26" stroke-width=".8"/>
        <rect x="636" y="164" width="8" height="116" fill="#ebdbb2" fill-opacity=".06" stroke="#bdae93" stroke-width=".8"/>
        <rect x="876" y="380" width="8" height="208" fill="#ebdbb2" fill-opacity=".06" stroke="#bdae93" stroke-width=".8"/>
        <rect x="1116" y="304" width="8" height="64" fill="#83a598" fill-opacity=".08" stroke="#83a598" stroke-width=".8"/>

        <!-- Calls and returns before the branch -->
        <line x1="164" y1="128" x2="396" y2="128" stroke="#bdae93" stroke-width="1.2" marker-end="url(#shield-startup-sequence-dark-shield-startup-sequence-dark-arrow)"/>
        <rect x="220" y="108" width="120" height="12" rx="2" fill="#1d2021"/><text x="280" y="117" class="message">LOAD NATIVE IMAGE</text>

        <line x1="404" y1="172" x2="636" y2="172" stroke="#b8bb26" stroke-width="1.3" marker-end="url(#shield-startup-sequence-dark-shield-startup-sequence-dark-arrow-accent)"/>
        <rect x="456" y="152" width="128" height="12" rx="2" fill="#1d2021"/><text x="520" y="161" class="message" fill="#b8bb26">UNPACK BOOTSTRAP</text>

        <path d="M644 208 H720 Q728 208 728 216 V232 Q728 240 720 240 H648" fill="none" stroke="#bdae93" stroke-width="1.1" marker-end="url(#shield-startup-sequence-dark-shield-startup-sequence-dark-arrow)"/>
        <rect x="736" y="188" width="144" height="12" rx="2" fill="#1d2021"/><text x="808" y="197" class="message">CHECKSUM · KEY · CHACHA8</text>

        <line x1="636" y1="268" x2="404" y2="268" stroke="#bdae93" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#shield-startup-sequence-dark-shield-startup-sequence-dark-arrow)"/>
        <rect x="460" y="248" width="120" height="12" rx="2" fill="#1d2021"/><text x="520" y="257" class="message">MAIN REGION READY</text>

        <line x1="404" y1="312" x2="1116" y2="312" stroke="#83a598" stroke-width="1.2" marker-end="url(#shield-startup-sequence-dark-shield-startup-sequence-dark-arrow-link)"/>
        <rect x="690" y="292" width="140" height="12" rx="2" fill="#1d2021"/><text x="760" y="301" class="message" fill="#83a598">FORK · PTRACE SETUP</text>

        <line x1="1116" y1="344" x2="404" y2="344" stroke="#83a598" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#shield-startup-sequence-dark-shield-startup-sequence-dark-arrow-link)"/>
        <rect x="700" y="324" width="120" height="12" rx="2" fill="#1d2021"/><text x="760" y="333" class="message" fill="#83a598">PARENT TRACED</text>

        <line x1="404" y1="388" x2="876" y2="388" stroke="#bdae93" stroke-width="1.2" marker-end="url(#shield-startup-sequence-dark-shield-startup-sequence-dark-arrow)"/>
        <rect x="562" y="368" width="156" height="12" rx="2" fill="#1d2021"/><text x="640" y="377" class="message">START CONCURRENT CHECKS</text>

        <!-- ALT fragment -->
        <rect x="120" y="420" width="800" height="196" rx="4" fill="#ebdbb2" fill-opacity=".025" stroke="#ebdbb2" stroke-opacity=".24"/>
        <rect x="120" y="420" width="44" height="16" rx="2" fill="#1d2021" stroke="#ebdbb2" stroke-opacity=".24"/><text x="142" y="432" class="fragment">ALT</text>
        <text x="176" y="452" class="guard">[evidence clean]</text>

        <line x1="876" y1="480" x2="404" y2="480" stroke="#b8bb26" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#shield-startup-sequence-dark-shield-startup-sequence-dark-arrow-accent)"/>
        <rect x="570" y="460" width="140" height="12" rx="2" fill="#1d2021"/><text x="640" y="469" class="message" fill="#b8bb26">CLEAN RESULT</text>

        <line x1="396" y1="512" x2="164" y2="512" stroke="#b8bb26" stroke-width="1.3" marker-end="url(#shield-startup-sequence-dark-shield-startup-sequence-dark-arrow-accent)"/>
        <rect x="216" y="492" width="128" height="12" rx="2" fill="#1d2021"/><text x="280" y="501" class="message" fill="#b8bb26">RELEASE STARTUP</text>

        <line x1="128" y1="532" x2="912" y2="532" stroke="#ebdbb2" stroke-opacity=".20" stroke-dasharray="4,3"/>
        <text x="176" y="552" class="guard">[violation or inconsistent state]</text>

        <line x1="876" y1="576" x2="404" y2="576" stroke="#fb4934" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#shield-startup-sequence-dark-shield-startup-sequence-dark-arrow)"/>
        <rect x="570" y="556" width="140" height="12" rx="2" fill="#1d2021"/><text x="640" y="565" class="message" fill="#fb4934">FATAL VERDICT</text>

        <line x1="396" y1="604" x2="164" y2="604" stroke="#fb4934" stroke-width="1.2" marker-end="url(#shield-startup-sequence-dark-shield-startup-sequence-dark-arrow)"/>
        <rect x="208" y="584" width="144" height="12" rx="2" fill="#1d2021"/><text x="280" y="593" class="message" fill="#fb4934">POISON · REPORT</text>

        <!-- Actors drawn last -->
        <rect x="80" y="40" width="160" height="56" rx="6" fill="#282828" stroke="#ebdbb2" stroke-opacity=".34"/><text x="160" y="66" class="actor">Java wrapper</text><text x="160" y="84" class="actor-sub">startup + reporter</text>
        <rect x="320" y="40" width="160" height="56" rx="6" fill="#b8bb26" fill-opacity=".12" stroke="#b8bb26"/><text x="400" y="66" class="actor">Native core</text><text x="400" y="84" class="actor-sub">coordination barrier</text>
        <rect x="560" y="40" width="160" height="56" rx="6" fill="#282828" stroke="#ebdbb2" stroke-opacity=".34"/><text x="640" y="66" class="actor">Unpacker</text><text x="640" y="84" class="actor-sub">protected code</text>
        <rect x="800" y="40" width="160" height="56" rx="6" fill="#282828" stroke="#ebdbb2" stroke-opacity=".34"/><text x="880" y="66" class="actor">Detector pool</text><text x="880" y="84" class="actor-sub">parallel checks</text>
        <rect x="1040" y="40" width="160" height="56" rx="6" fill="#83a598" fill-opacity=".07" stroke="#83a598"/><text x="1120" y="66" class="actor">Self-tracer</text><text x="1120" y="84" class="actor-sub">ptrace child</text>

        <line x1="40" y1="660" x2="1240" y2="660" stroke="#ebdbb2" stroke-opacity=".14"/>
        <text x="40" y="682" class="legend-label">TIME FLOWS TOP TO BOTTOM</text>
        <line x1="312" y1="678" x2="344" y2="678" stroke="#bdae93" marker-end="url(#shield-startup-sequence-dark-shield-startup-sequence-dark-arrow)"/><text x="356" y="682" class="legend-text">Call</text>
        <line x1="432" y1="678" x2="464" y2="678" stroke="#bdae93" stroke-dasharray="5,4" marker-end="url(#shield-startup-sequence-dark-shield-startup-sequence-dark-arrow)"/><text x="476" y="682" class="legend-text">Return</text>
        <rect x="580" y="670" width="48" height="16" rx="2" fill="#ebdbb2" fill-opacity=".025" stroke="#ebdbb2" stroke-opacity=".24"/><text x="640" y="682" class="legend-text">Verdict branch</text>
      </svg>
