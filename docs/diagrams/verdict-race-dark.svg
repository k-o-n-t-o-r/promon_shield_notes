<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="verdict-race-dark-title verdict-race-dark-desc" id="verdict-race-dark-root">
        <title id="verdict-race-dark-title">SHIELD 8.2.4 concurrent verdict race</title>
        <desc id="verdict-race-dark-desc">Architecture showing mapping, hook-framework, and native-redirection workers racing to write shared verdict state, which controls startup release, protected-service poisoning, Java reporting, and self-tracer enforcement.</desc>
        <defs>
      <style>#verdict-race-dark-root { --paper:#1d2021;--paper-2:#282828;--ink:#ebdbb2;--muted:#bdae93;--soft:#a89984;--accent:#b8bb26;--link:#83a598;--sans:'Geist',system-ui,sans-serif;--serif:'Instrument Serif',serif;--mono:'Geist Mono',ui-monospace,monospace }
      #verdict-race-dark-root { color: var(--ink); font-family: var(--sans); }
      #verdict-race-dark-root .diagram-container { width:100%;overflow-x:auto }
      #verdict-race-dark-root .zone { fill:var(--soft);font:500 8px var(--mono);letter-spacing:.14em;text-anchor:middle }
      #verdict-race-dark-root .tag { fill:var(--muted);font:500 8px var(--mono);text-anchor:middle }
      #verdict-race-dark-root .name { fill:var(--ink);font:600 12px var(--sans);text-anchor:middle }
      #verdict-race-dark-root .sub { fill:var(--muted);font:400 9px var(--mono);text-anchor:middle }
      #verdict-race-dark-root .edge { fill:var(--soft);font:400 8px var(--mono);letter-spacing:.04em;text-anchor:middle }
      #verdict-race-dark-root .legend-label { fill:var(--muted);font:500 8px var(--mono);letter-spacing:.16em }
      #verdict-race-dark-root .legend-text { fill:var(--muted);font:400 9px var(--sans) }
      #verdict-race-dark-root .diagram-container { overflow-x:visible }</style>
          <marker id="verdict-race-dark-verdict-race-dark-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#bdae93"/></marker>
          <marker id="verdict-race-dark-verdict-race-dark-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#b8bb26"/></marker>
          <marker id="verdict-race-dark-verdict-race-dark-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#83a598"/></marker>
        </defs>
        <rect width="1280" height="720" fill="#1d2021"/>

        <!-- Zones -->
        <rect x="40" y="80" width="280" height="520" rx="8" fill="#ebdbb2" fill-opacity=".02" stroke="#ebdbb2" stroke-opacity=".14"/>
        <rect x="360" y="80" width="320" height="520" rx="8" fill="#b8bb26" fill-opacity=".018" stroke="#b8bb26" stroke-opacity=".20"/>
        <rect x="720" y="80" width="280" height="520" rx="8" fill="#fb4934" fill-opacity=".018" stroke="#fb4934" stroke-opacity=".22"/>
        <rect x="1040" y="80" width="200" height="520" rx="8" fill="#83a598" fill-opacity=".025" stroke="#83a598" stroke-opacity=".28"/>
        <rect x="112" y="84" width="136" height="16" rx="2" fill="#1d2021"/><text x="180" y="96" class="zone">DETECTOR POOL</text>
        <rect x="444" y="84" width="152" height="16" rx="2" fill="#1d2021"/><text x="520" y="96" class="zone">SHARED STATE</text>
        <rect x="792" y="84" width="136" height="16" rx="2" fill="#1d2021"/><text x="860" y="96" class="zone">SIDE EFFECTS</text>
        <rect x="1080" y="84" width="120" height="16" rx="2" fill="#1d2021"/><text x="1140" y="96" class="zone">APPLICATION</text>

        <!-- Worker-to-state paths -->
        <path d="M280 160 H344 Q352 160 352 168 V252 Q352 260 360 260 H400" fill="none" stroke="#bdae93" marker-end="url(#verdict-race-dark-verdict-race-dark-arrow)"/>
        <line x1="280" y1="300" x2="400" y2="300" stroke="#bdae93" marker-end="url(#verdict-race-dark-verdict-race-dark-arrow)"/>
        <path d="M280 440 H344 Q352 440 352 432 V348 Q352 340 360 340 H400" fill="none" stroke="#bdae93" marker-end="url(#verdict-race-dark-verdict-race-dark-arrow)"/>

        <!-- Shared-state fan-out -->
        <path d="M520 220 V164 Q520 156 528 156 H760" fill="none" stroke="#b8bb26" stroke-width="1.2" marker-end="url(#verdict-race-dark-verdict-race-dark-arrow-accent)"/>
        <line x1="640" y1="276" x2="760" y2="276" stroke="#fb4934" stroke-width="1.1" marker-end="url(#verdict-race-dark-verdict-race-dark-arrow)"/>
        <path d="M640 324 H692 Q700 324 700 332 V388 Q700 396 708 396 H760" fill="none" stroke="#fb4934" stroke-width="1.1" marker-end="url(#verdict-race-dark-verdict-race-dark-arrow)"/>
        <path d="M560 380 V508 Q560 516 568 516 H760" fill="none" stroke="#83a598" stroke-width="1.1" marker-end="url(#verdict-race-dark-verdict-race-dark-arrow-link)"/>

        <line x1="960" y1="156" x2="1060" y2="156" stroke="#b8bb26" stroke-width="1.2" marker-end="url(#verdict-race-dark-verdict-race-dark-arrow-accent)"/>
        <path d="M960 276 H1132 Q1140 276 1140 268 V192" fill="none" stroke="#bdae93" stroke-dasharray="5,4" marker-end="url(#verdict-race-dark-verdict-race-dark-arrow)"/>

        <!-- Labels -->
        <rect x="296" y="236" width="64" height="12" rx="2" fill="#1d2021"/><text x="328" y="245" class="edge">RESULT A</text>
        <rect x="304" y="272" width="72" height="12" rx="2" fill="#1d2021"/><text x="340" y="281" class="edge">RESULT B</text>
        <rect x="296" y="356" width="64" height="12" rx="2" fill="#1d2021"/><text x="328" y="365" class="edge">RESULT C</text>
        <rect x="628" y="136" width="72" height="12" rx="2" fill="#1d2021"/><text x="664" y="145" class="edge" fill="#b8bb26">CLEAN</text>
        <rect x="664" y="248" width="72" height="12" rx="2" fill="#1d2021"/><text x="700" y="257" class="edge" fill="#fb4934">POISON</text>
        <rect x="708" y="344" width="72" height="12" rx="2" fill="#1d2021"/><text x="744" y="353" class="edge" fill="#fb4934">REPORT</text>
        <rect x="628" y="488" width="80" height="12" rx="2" fill="#1d2021"/><text x="668" y="497" class="edge" fill="#83a598">ENFORCE</text>
        <rect x="980" y="136" width="60" height="12" rx="2" fill="#1d2021"/><text x="1010" y="145" class="edge" fill="#b8bb26">RELEASE</text>
        <rect x="1036" y="256" width="72" height="12" rx="2" fill="#1d2021"/><text x="1072" y="265" class="edge">SERVICES READY</text>

        <!-- Detector workers -->
        <rect x="80" y="120" width="200" height="80" rx="6" fill="#282828" stroke="#ebdbb2" stroke-opacity=".34"/><rect x="88" y="128" width="36" height="14" rx="2" fill="none" stroke="#ebdbb2" stroke-opacity=".32"/><text x="106" y="138" class="tag">ROOT</text><text x="180" y="160" class="name">Mapping worker</text><text x="180" y="178" class="sub">properties · su paths · xattr</text><text x="180" y="192" class="sub">maps · objects · inotify</text>
        <rect x="80" y="260" width="200" height="80" rx="6" fill="#282828" stroke="#ebdbb2" stroke-opacity=".34"/><rect x="88" y="268" width="36" height="14" rx="2" fill="none" stroke="#ebdbb2" stroke-opacity=".32"/><text x="106" y="278" class="tag">HOOK</text><text x="180" y="300" class="name">Hook-framework worker</text><text x="180" y="318" class="sub">entry bytes · trampolines</text><text x="180" y="332" class="sub">framework mappings</text>
        <rect x="80" y="400" width="200" height="80" rx="6" fill="#282828" stroke="#ebdbb2" stroke-opacity=".34"/><rect x="88" y="408" width="36" height="14" rx="2" fill="none" stroke="#ebdbb2" stroke-opacity=".32"/><text x="106" y="418" class="tag">NAT</text><text x="180" y="440" class="name">Native-hook worker</text><text x="180" y="458" class="sub">GOT slots · relocations</text><text x="180" y="472" class="sub">late code mutation</text>

        <!-- Shared verdict state -->
        <rect x="400" y="220" width="240" height="160" rx="6" fill="#b8bb26" fill-opacity=".10" stroke="#b8bb26" stroke-width="1.2"/>
        <rect x="408" y="228" width="44" height="14" rx="2" fill="none" stroke="#b8bb26" stroke-opacity=".58"/><text x="430" y="238" class="tag" fill="#b8bb26">STATE</text>
        <text x="520" y="266" class="name">Verdict record + lock</text>
        <text x="520" y="288" class="sub">indexed 24-byte records</text>
        <text x="520" y="308" class="sub">callback object · fatal flag</text>
        <text x="520" y="328" class="sub">1 · first completed worker wins</text>
        <text x="520" y="348" class="sub">clean path or violation fan-out</text>

        <!-- Side effects -->
        <rect x="760" y="120" width="200" height="72" rx="6" fill="#b8bb26" fill-opacity=".10" stroke="#b8bb26"/><text x="860" y="150" class="name">Startup barrier</text><text x="860" y="170" class="sub">3 · release only after checks</text>
        <rect x="760" y="240" width="200" height="72" rx="6" fill="#fb4934" fill-opacity=".06" stroke="#fb4934" stroke-opacity=".55"/><text x="860" y="270" class="name">Protected services</text><text x="860" y="290" class="sub">2 · strings and keys invalidated</text>
        <rect x="760" y="360" width="200" height="72" rx="6" fill="#fb4934" fill-opacity=".06" stroke="#fb4934" stroke-opacity=".55"/><text x="860" y="390" class="name">Java reporter</text><text x="860" y="410" class="sub">4 · reason class · fatal callback</text>
        <rect x="760" y="480" width="200" height="72" rx="6" fill="#83a598" fill-opacity=".07" stroke="#83a598"/><text x="860" y="510" class="name">Self-tracer path</text><text x="860" y="530" class="sub">5 · independent raw termination</text>

        <!-- App -->
        <rect x="1060" y="120" width="160" height="72" rx="20" fill="#b8bb26" fill-opacity=".10" stroke="#b8bb26"/><text x="1140" y="150" class="name">App initialized</text><text x="1140" y="170" class="sub">UI + protected services</text>

        <line x1="40" y1="640" x2="1240" y2="640" stroke="#ebdbb2" stroke-opacity=".14"/>
        <text x="40" y="662" class="legend-label">LEGEND</text>
        <rect x="136" y="650" width="18" height="12" rx="2" fill="#282828" stroke="#ebdbb2" stroke-opacity=".34"/><text x="164" y="660" class="legend-text">Independent worker</text>
        <rect x="344" y="650" width="18" height="12" rx="2" fill="#b8bb26" fill-opacity=".10" stroke="#b8bb26"/><text x="372" y="660" class="legend-text">Shared state / clean path</text>
        <rect x="612" y="650" width="18" height="12" rx="2" fill="#fb4934" fill-opacity=".06" stroke="#fb4934" stroke-opacity=".55"/><text x="640" y="660" class="legend-text">Violation side effect</text>
        <rect x="840" y="650" width="18" height="12" rx="2" fill="#83a598" fill-opacity=".07" stroke="#83a598"/><text x="868" y="660" class="legend-text">Independent enforcement</text>
      </svg>
