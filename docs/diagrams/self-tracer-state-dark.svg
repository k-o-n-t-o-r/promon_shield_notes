<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="self-tracer-state-dark-title self-tracer-state-dark-desc" id="self-tracer-state-dark-root">
        <title id="self-tracer-state-dark-title">SHIELD self-tracer state machine</title>
        <desc id="self-tracer-state-dark-desc">State machine showing channel setup, tracer fork, parent attachment, waitpid event handling, expected ptrace event dispatch and continuation, and fail-closed raw process termination.</desc>
        <defs>
      <style>#self-tracer-state-dark-root { --paper:#1d2021;--paper-2:#282828;--ink:#ebdbb2;--muted:#bdae93;--soft:#a89984;--accent:#b8bb26;--link:#83a598;--sans:'Geist',system-ui,sans-serif;--serif:'Instrument Serif',serif;--mono:'Geist Mono',ui-monospace,monospace }
      #self-tracer-state-dark-root { color: var(--ink); font-family: var(--sans); }
      #self-tracer-state-dark-root .diagram-container { width:100%;overflow-x:auto }
      #self-tracer-state-dark-root .name { fill:var(--ink);font:600 12px var(--sans);text-anchor:middle }
      #self-tracer-state-dark-root .sub { fill:var(--muted);font:400 9px var(--mono);text-anchor:middle }
      #self-tracer-state-dark-root .event-detail { fill:var(--muted);font:400 9px var(--mono);text-anchor:start }
      #self-tracer-state-dark-root .edge { fill:var(--soft);font:400 8px var(--mono);letter-spacing:.04em;text-anchor:middle }
      #self-tracer-state-dark-root .band { fill:var(--soft);font:500 8px var(--mono);letter-spacing:.14em }
      #self-tracer-state-dark-root .legend-label { fill:var(--muted);font:500 8px var(--mono);letter-spacing:.16em }
      #self-tracer-state-dark-root .legend-text { fill:var(--muted);font:400 9px var(--sans) }
      #self-tracer-state-dark-root .diagram-container { overflow-x:visible }</style>
          <marker id="self-tracer-state-dark-self-tracer-state-dark-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#bdae93"/></marker>
          <marker id="self-tracer-state-dark-self-tracer-state-dark-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#b8bb26"/></marker>
        </defs>
        <rect width="1280" height="560" fill="#1d2021"/>

        <text x="40" y="104" class="band">PRIMARY TRACE LOOP</text>
        <text x="40" y="376" class="band">FAIL-CLOSED TERMINATION</text>
        <line x1="40" y1="352" x2="1240" y2="352" stroke="#ebdbb2" stroke-opacity=".14" stroke-dasharray="4,4"/>

        <!-- Transitions first -->
        <line x1="66" y1="176" x2="100" y2="176" stroke="#bdae93" marker-end="url(#self-tracer-state-dark-self-tracer-state-dark-arrow)"/>
        <line x1="244" y1="176" x2="280" y2="176" stroke="#bdae93" marker-end="url(#self-tracer-state-dark-self-tracer-state-dark-arrow)"/>
        <line x1="424" y1="176" x2="460" y2="176" stroke="#bdae93" marker-end="url(#self-tracer-state-dark-self-tracer-state-dark-arrow)"/>
        <line x1="604" y1="176" x2="640" y2="176" stroke="#bdae93" marker-end="url(#self-tracer-state-dark-self-tracer-state-dark-arrow)"/>
        <line x1="784" y1="176" x2="820" y2="176" stroke="#bdae93" marker-end="url(#self-tracer-state-dark-self-tracer-state-dark-arrow)"/>
        <line x1="964" y1="176" x2="1000" y2="176" stroke="#b8bb26" stroke-width="1.3" marker-end="url(#self-tracer-state-dark-self-tracer-state-dark-arrow-accent)"/>

        <path d="M1072 140 V108 Q1072 100 1064 100 H720 Q712 100 712 108 V140" fill="none" stroke="#b8bb26" stroke-width="1.2" marker-end="url(#self-tracer-state-dark-self-tracer-state-dark-arrow-accent)"/>

        <path d="M892 212 V320 Q892 328 884 328 H868 Q860 328 860 336 V400" fill="none" stroke="#fb4934" stroke-width="1.2" marker-end="url(#self-tracer-state-dark-self-tracer-state-dark-arrow)"/>
        <line x1="900" y1="436" x2="960" y2="436" stroke="#fb4934" stroke-width="1.2" marker-end="url(#self-tracer-state-dark-self-tracer-state-dark-arrow)"/>
        <line x1="1160" y1="436" x2="1192" y2="436" stroke="#fb4934" stroke-width="1.2" marker-end="url(#self-tracer-state-dark-self-tracer-state-dark-arrow)"/>

        <!-- Transition labels -->
        <rect x="68" y="148" width="32" height="12" rx="2" fill="#1d2021"/><text x="84" y="157" class="edge">BOOT</text>
        <rect x="246" y="148" width="32" height="12" rx="2" fill="#1d2021"/><text x="262" y="157" class="edge">READY</text>
        <rect x="426" y="148" width="32" height="12" rx="2" fill="#1d2021"/><text x="442" y="157" class="edge">CHILD</text>
        <rect x="606" y="148" width="32" height="12" rx="2" fill="#1d2021"/><text x="622" y="157" class="edge">SEIZE</text>
        <rect x="786" y="148" width="32" height="12" rx="2" fill="#1d2021"/><text x="802" y="157" class="edge">STOP</text>
        <rect x="966" y="148" width="32" height="12" rx="2" fill="#1d2021"/><text x="982" y="157" class="edge" fill="#b8bb26">KNOWN</text>
        <rect x="832" y="80" width="120" height="12" rx="2" fill="#1d2021"/><text x="892" y="89" class="edge" fill="#b8bb26">PTRACE_CONT · NEXT</text>
        <rect x="900" y="288" width="132" height="12" rx="2" fill="#1d2021"/><text x="966" y="297" class="edge" fill="#fb4934">UNEXPECTED · TIMEOUT</text>
        <rect x="916" y="408" width="28" height="12" rx="2" fill="#1d2021"/><text x="930" y="417" class="edge" fill="#fb4934">KILL</text>

        <!-- Primary states -->
        <circle cx="60" cy="176" r="6" fill="#ebdbb2"/>

        <rect x="100" y="140" width="144" height="72" rx="8" fill="#282828" stroke="#ebdbb2" stroke-opacity=".34"/>
        <text x="172" y="174" class="name">Prepare channels</text><text x="172" y="194" class="sub">socketpair · epoll</text>

        <rect x="280" y="140" width="144" height="72" rx="8" fill="#282828" stroke="#ebdbb2" stroke-opacity=".34"/>
        <text x="352" y="174" class="name">Fork tracer</text><text x="352" y="194" class="sub">dumpable toggle · fork</text>

        <rect x="460" y="140" width="144" height="72" rx="8" fill="#282828" stroke="#ebdbb2" stroke-opacity=".34"/>
        <text x="532" y="174" class="name">Attach parent</text><text x="532" y="194" class="sub">ptrace options · registry</text>

        <rect x="640" y="140" width="144" height="72" rx="8" fill="#282828" stroke="#ebdbb2" stroke-opacity=".34"/>
        <text x="712" y="174" class="name">Wait for event</text><text x="712" y="194" class="sub">waitpid(-1, __WALL)</text>

        <rect x="820" y="140" width="144" height="72" rx="8" fill="#b8bb26" fill-opacity=".10" stroke="#b8bb26"/>
        <text x="892" y="174" class="name">Dispatch status</text><text x="892" y="194" class="sub">event · signal · syscall</text>

        <rect x="1000" y="140" width="144" height="72" rx="8" fill="#b8bb26" fill-opacity=".10" stroke="#b8bb26"/>
        <text x="1072" y="174" class="name">Continue tracee</text><text x="1072" y="194" class="sub">registry · PTRACE_CONT</text>

        <!-- Failure states -->
        <rect x="700" y="400" width="200" height="72" rx="8" fill="#fb4934" fill-opacity=".07" stroke="#fb4934" stroke-opacity=".70"/>
        <text x="800" y="434" class="name">Fail closed</text><text x="800" y="454" class="sub">state mismatch · timeout · error</text>

        <rect x="960" y="400" width="200" height="72" rx="8" fill="#fb4934" fill-opacity=".07" stroke="#fb4934" stroke-opacity=".70"/>
        <text x="1060" y="430" class="name">Terminate process tree</text><text x="1060" y="448" class="sub">tracees · parent · tracer</text><text x="1060" y="462" class="sub">raw kill · exit_group(1)</text>

        <circle cx="1200" cy="436" r="8" fill="none" stroke="#fb4934" stroke-width="1.2"/><circle cx="1200" cy="436" r="5" fill="#fb4934"/>

        <!-- Event detail -->
        <rect x="120" y="264" width="480" height="56" rx="6" fill="#ebdbb2" fill-opacity=".025" stroke="#ebdbb2" stroke-opacity=".18"/>
        <text x="136" y="286" class="band">EXPECTED EVENTS</text>
        <text x="136" y="306" class="event-detail">FORK · VFORK · CLONE · EXEC · SECCOMP · SYSGOOD · ordinary signal stop</text>

        <line x1="40" y1="520" x2="1240" y2="520" stroke="#ebdbb2" stroke-opacity=".14"/>
        <text x="40" y="542" class="legend-label">LEGEND</text>
        <circle cx="148" cy="536" r="5" fill="#ebdbb2"/><text x="164" y="540" class="legend-text">Start</text>
        <rect x="244" y="530" width="24" height="14" rx="5" fill="#282828" stroke="#ebdbb2" stroke-opacity=".34"/><text x="280" y="540" class="legend-text">Normal state</text>
        <rect x="412" y="530" width="24" height="14" rx="5" fill="#b8bb26" fill-opacity=".10" stroke="#b8bb26"/><text x="448" y="540" class="legend-text">Decision / continuation</text>
        <rect x="652" y="530" width="24" height="14" rx="5" fill="#fb4934" fill-opacity=".07" stroke="#fb4934" stroke-opacity=".70"/><text x="688" y="540" class="legend-text">Fail closed</text>
      </svg>
